<!doctype html>

<html lang="es">

<head>
  <meta charset="utf-8" />
  <!-- El título de arranque: lo que se ve en la pestaña antes de que Angular
       cargue, y lo que lee un rastreador que no ejecuta JavaScript. Cada
       pantalla lo reemplaza después con el suyo, desde el servicio `Seo`. -->
  <title>Posgrado UNIOR · Universidad Privada de Oruro</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Roboto:wght@300;400;500;700&amp;display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- Metadatos de arranque. Cada pantalla los reemplaza con los suyos desde el
       servicio `Seo`; estos son los que quedan en la portada y los que se ven si
       algo falla antes de que Angular tome el control. -->
  <meta name="description"
    content="Universidad UNIOR - Plataforma educativa LMS para estudiantes, profesores y personal administrativo.">

  <link rel="canonical" href="https://learn-unior.web.app/">



  <!-- ========================================== -->
  <!-- OPEN GRAPH (Facebook, LinkedIn, WhatsApp, etc.) -->
  <!-- ========================================== -->
  <!-- Tipo de contenido (usa "website" para páginas generales o "article" para blogs) -->
  <meta property="og:type" content="website">
  <!-- Título que aparecerá en la red social -->
  <meta property="og:title" content="Universidad UNIOR - Plataforma educativa LMS">
  <!-- Descripción que acompañará al enlace -->
  <meta property="og:description"
    content="Universidad UNIOR - Plataforma educativa LMS para estudiantes, profesores y personal administrativo.">
  <!-- URL absoluta de tu página -->
  <meta property="og:url" content="https://learn-unior.web.app/">
  <!-- URL absoluta de tu imagen (Tamaño ideal: 1200x630 píxeles) -->
  <meta property="og:image" content="https://learn-unior.web.app/icons/icon-512x512.png">
  <!-- Texto alternativo de la imagen para accesibilidad -->
  <meta property="og:image:alt" content="Logo de la Plataforma educativa LMS UNIOR">
  <!-- Nombre comercial de tu sitio web o marca -->
  <meta property="og:site_name" content="Universidad UNIOR">
  <!-- Idioma y región (ej. es_LA para español Latinoamérica o es_ES para España) -->
  <meta property="og:locale" content="es_LA">

  <!-- ========================================== -->
  <!-- TWITTER CARDS (Exclusivo para X / Twitter) -->
  <!-- ========================================== -->
  <!-- Formato de tarjeta (summary_large_image muestra la foto grande que abarca todo el ancho) -->
  <meta name="twitter:card" content="summary_large_image">
  <!-- Usuario de X de tu página/empresa -->
  <meta name="twitter:site" content="@unior.edu">
  <!-- Usuario de X del autor o creador del artículo -->
  <meta name="twitter:creator" content="@unior.edu">
  <!-- Título específico para X -->
  <meta name="twitter:title" content="Universidad UNIOR - Plataforma educativa LMS">
  <!-- Descripción específica para X -->
  <meta name="twitter:description"
    content="Universidad UNIOR - Plataforma educativa LMS para estudiantes, profesores y personal administrativo.">
  <!-- URL absoluta de la imagen para X -->
  <meta name="twitter:image" content="https://learn-unior.web.app/icons/icon-512x512.png">


</head>

<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
